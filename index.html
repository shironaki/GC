<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10171b">
<meta name="description" content="Gangstar City: Revival — мобильная городская криминальная песочница.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./styles.css">
<title>Gangstar City: Revival</title>
</head>
<body>
<main id="game">
  <canvas id="world" aria-label="Игровой город"></canvas>
  <header class="hud-top">
    <div class="brand"><strong>GANGSTAR CITY</strong><span>REVIVAL</span></div>
    <div class="resources" id="resources" aria-live="polite"></div>
    <button class="menu-button" id="menu-open" aria-label="Открыть меню">☰</button>
  </header>
  <section class="mission-card" id="mission-card" aria-live="polite"></section>
  <section class="district-tag" id="district-tag">EAST SIDE</section>
  <section class="controls" id="controls">
    <div class="joystick" id="joystick"><div class="joystick-knob" id="joystick-knob"></div></div>
    <div class="action-stack">
      <button class="action-button secondary" id="interact">ДЕЙСТВИЕ</button>
      <button class="action-button sprint-button" id="sprint">БЕГ</button>
      <button class="action-button" id="attack">АТАКА</button>
    </div>
  </section>
  <div class="toast" id="toast" role="status"></div>
  <div class="modal-backdrop" id="modal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" aria-label="Закрыть">×</button>
      <div id="modal-content"></div>
    </section>
  </div>
  <div class="loading" id="loading"><div class="loading-mark">GC</div><strong>GANGSTAR CITY: REVIVAL</strong><span>Загрузка города…</span></div>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
